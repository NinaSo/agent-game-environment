name: Offline tests and reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Run all tests without model credentials
        run: python -m pytest -q
      - name: Recreate and replay synthetic journal
        run: python scripts/replay_fixture.py
      - name: Build and verify static site and source release
        run: |
          python scripts/publication.py site --out dist/site
          python scripts/publication.py verify dist/site
          python scripts/publication.py source --out dist/agent-game-lab-source.zip
          python scripts/publication.py verify dist/agent-game-lab-source.zip
      - name: Test the clean extracted source release
        run: |
          python -m zipfile -e dist/agent-game-lab-source.zip "$RUNNER_TEMP/agent-lab-source"
          cd "$RUNNER_TEMP/agent-lab-source/agent_game_lab"
          python -m venv "$RUNNER_TEMP/agent-lab-clean-venv"
          "$RUNNER_TEMP/agent-lab-clean-venv/bin/python" -m pip install ".[test]"
          "$RUNNER_TEMP/agent-lab-clean-venv/bin/python" -m pytest -q
          "$RUNNER_TEMP/agent-lab-clean-venv/bin/python" scripts/replay_fixture.py
          "$RUNNER_TEMP/agent-lab-clean-venv/bin/python" scripts/publication.py site --out "$RUNNER_TEMP/agent-lab-clean-site"
          "$RUNNER_TEMP/agent-lab-clean-venv/bin/python" scripts/publication.py verify "$RUNNER_TEMP/agent-lab-clean-site"
