name: Publish research dashboard

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENROUTER_API_KEY: ""
      REPOSITORY_URL: https://github.com/${{ github.repository }}
      EVIDENCE_RELEASE_URL: ${{ vars.EVIDENCE_RELEASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[test]"
      - name: Verify code and synthetic replay before publishing
        run: |
          python -m pytest -q
          python scripts/replay_fixture.py
      - uses: actions/configure-pages@v5
      - name: Build only allowlisted public assets
        shell: bash
        run: |
          args=(site --out dist/site --repo-url "$REPOSITORY_URL")
          if [[ -n "$EVIDENCE_RELEASE_URL" ]]; then args+=(--release-url "$EVIDENCE_RELEASE_URL"); fi
          python scripts/publication.py "${args[@]}"
          python scripts/publication.py verify dist/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
